name: Overnight train

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      budget_ms:
        description: Wall-clock training budget in milliseconds
        required: false
        default: "720000"
      matches:
        description: Optional match cap (empty = budget only)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Train
        env:
          BUDGET_MS: ${{ github.event.inputs.budget_ms || '720000' }}
          MATCHES: ${{ github.event.inputs.matches }}
        run: |
          set -euo pipefail
          args=(--budget-ms "${BUDGET_MS}")
          if [ -n "${MATCHES}" ]; then
            args+=(--matches "${MATCHES}")
          fi
          npm run train -- "${args[@]}"

      - name: Commit books
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books
          if git diff --staged --quiet; then
            echo "No book changes"
            exit 0
          fi
          gen="$(node -e "const b=JSON.parse(require('fs').readFileSync('books/latest.json','utf8')); process.stdout.write(String(b.gen??0))")"
          games="$(node -e "const b=JSON.parse(require('fs').readFileSync('books/latest.json','utf8')); process.stdout.write(String(b.games??0))")"
          msg="chore: overnight book gen ${gen} games ${games}"
          git commit -m "${msg}"

          # Snapshot this job's trained books so a rebase onto a moved main
          # can keep them even if books/ conflicts (never force-push).
          trained="$(mktemp -d)"
          cp -a books/. "${trained}/"

          publish() {
            git fetch origin main
            if ! git pull --rebase origin main; then
              echo "Rebase conflict — keeping this job's books, other files from main"
              git rebase --abort || true
              git reset --hard origin/main
              mkdir -p books
              cp -a "${trained}/." books/
              git add books
              if ! git diff --staged --quiet; then
                git commit -m "${msg}"
              fi
            fi
            git push origin HEAD:main
          }

          if ! publish; then
            echo "Push rejected; retrying once after rebase"
            publish
          fi
